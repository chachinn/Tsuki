name: Tsuki 7.5 Cloud Backup Rules Final

on:
  push:
    branches: [agent/tsuki-7-5-cloud-backup]
    paths: [.github/workflows/tsuki75-cloud-backup-rules-final.yml]

permissions:
  contents: write

jobs:
  rules-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recheck build, verify Firestore isolation and finalize branch
        env:
          BASE_SHA: 6dfa05de1dbe94a56b927eac7438646378d63423
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          python3 .github/patches/tsuki75_cloud_backup_patch.py
          node --check app.js
          node --check firebase-tsuki.js
          node --check firebase-backup.js
          node --check service-worker.js
          git diff --check

          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(); a=Path('app.js').read_text(); b=Path('firebase-backup.js').read_text(); sw=Path('service-worker.js').read_text(); r=Path('firestore.rules').read_text()
          ids=re.findall(r'\bid="([^"]+)"',h); assert len(ids)==len(set(ids))
          assert 'const APP_VERSION = "7.5.0";' in a
          assert 'const APP_CACHE_NAME = "tsuki-cache-v7-5";' in a
          assert 'const CACHE_NAME = "tsuki-cache-v7-5";' in sw
          assert 'const BACKUP_HOUR = 8;' in b and 'const RETAINED_SNAPSHOTS = 7;' in b
          assert 'ensureConsent' in b and 'firebase-storage' not in b.lower() and 'tsuki-app-lock-v1' not in b
          assert 'match /tsukiCloudBackups/{userId}/{document=**}' in r
          assert 'request.auth != null && request.auth.uid == userId' in r
          install=sw.split('self.addEventListener("install"',1)[1].split('UPDATE CONTROL',1)[0]; assert 'skipWaiting' not in install
          print('Final static QA passed')
          PY

          mkdir -p /tmp/rules && cd /tmp/rules
          npm init -y >/dev/null 2>&1
          npm install --silent firebase@12.16.0 @firebase/rules-unit-testing firebase-tools
          cat >/tmp/rules/test.mjs <<'JS'
          import fs from 'node:fs';
          import {initializeTestEnvironment,assertSucceeds,assertFails} from '@firebase/rules-unit-testing';
          import {doc,setDoc,getDoc} from 'firebase/firestore';
          const env=await initializeTestEnvironment({projectId:'demo-tsuki',firestore:{rules:fs.readFileSync(process.env.GITHUB_WORKSPACE+'/firestore.rules','utf8')}});
          const alice=env.authenticatedContext('alice').firestore();
          const bob=env.authenticatedContext('bob').firestore();
          const anon=env.unauthenticatedContext().firestore();
          await assertSucceeds(setDoc(doc(alice,'tsukiCloudBackups/alice/snapshots/one'),{status:'complete'}));
          await assertSucceeds(getDoc(doc(alice,'tsukiCloudBackups/alice/snapshots/one')));
          await assertFails(getDoc(doc(bob,'tsukiCloudBackups/alice/snapshots/one')));
          await assertFails(setDoc(doc(bob,'tsukiCloudBackups/alice/snapshots/two'),{status:'complete'}));
          await assertFails(getDoc(doc(anon,'tsukiCloudBackups/alice/snapshots/one')));
          await env.cleanup();
          console.log('Firestore rules QA passed: authenticated owner only');
          JS
          cd "$GITHUB_WORKSPACE"
          /tmp/rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-tsuki "node /tmp/rules/test.mjs"

          rm -f .github/patches/tsuki75_cloud_backup_patch.py .github/workflows/tsuki75-cloud-backup-qa.yml .github/workflows/tsuki75-cloud-backup-qa-v2.yml .github/workflows/tsuki75-cloud-backup-rules-final.yml
          git add app.js index.html style.css service-worker.js firebase-tsuki.js firebase-backup.js firestore.rules firebase.json
          git add -u .github
          git config user.name "Tsuki Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Tsuki 7.5 optional daily cloud backup"
          git push origin HEAD:agent/tsuki-7-5-cloud-backup
