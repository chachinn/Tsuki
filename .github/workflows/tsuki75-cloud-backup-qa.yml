name: Tsuki 7.5 Cloud Backup QA

on:
  push:
    branches: [agent/tsuki-7-5-cloud-backup]
    paths: [.github/workflows/tsuki75-cloud-backup-qa.yml]

permissions:
  contents: write

jobs:
  qa-and-build-branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Tsuki 7.5 and run stability gates
        env:
          BASE_SHA: 6dfa05de1dbe94a56b927eac7438646378d63423
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

          python3 .github/patches/tsuki75_cloud_backup_patch.py

          node --check app.js
          node --check firebase-tsuki.js
          node --check firebase-backup.js
          node --check service-worker.js
          git diff --check

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          auth = Path('firebase-tsuki.js').read_text(encoding='utf-8')
          backup = Path('firebase-backup.js').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          style = Path('style.css').read_text(encoding='utf-8')
          rules = Path('firestore.rules').read_text(encoding='utf-8')

          ids = re.findall(r'\bid="([^"]+)"', html)
          dup = sorted({x for x in ids if ids.count(x) > 1})
          assert not dup, f'duplicate IDs: {dup}'
          screens = set(re.findall(r'data-screen="([^"]+)"', html))
          routes = set(re.findall(r'data-open-screen="([^"]+)"', html)) | set(re.findall(r'data-screen-target="([^"]+)"', html))
          assert not (routes - screens), f'missing routes: {sorted(routes - screens)}'

          required_ids = [
            'firebaseCloudBackupPanel','firebaseCloudBackupFact','cloudBackupEnabled','cloudBackupNow',
            'cloudBackupHistorySelect','cloudRestorePreviewButton','cloudRestorePreview','cloudRestorePreviewContent',
            'cloudRestoreCancel','cloudRestoreConfirm','cloudBackupLastText','cloudBackupMessage','cloudDeleteBackups'
          ]
          for item in required_ids:
            assert f'id="{item}"' in html, item

          assert 'const APP_VERSION = "7.5.0";' in app
          assert 'const APP_CACHE_NAME = "tsuki-cache-v7-5";' in app
          assert 'const CACHE_NAME = "tsuki-cache-v7-5";' in sw
          assert '"./firebase-backup.js"' in sw
          assert '<script type="module" src="./firebase-backup.js"></script>' in html
          assert html.index('firebase-tsuki.js') < html.index('firebase-backup.js')
          assert 'get app() { return authState.app; }' in auth
          assert 'authState.app = firebaseApp;' in auth

          assert 'enabled: false' in backup
          assert 'const BACKUP_HOUR = 8;' in backup
          assert 'const RETAINED_SNAPSHOTS = 7;' in backup
          assert 'const FIRESTORE_CHUNK_BYTES = 550000;' in backup
          assert 'const MAX_ASSET_BYTES = 25 * 1024 * 1024;' in backup
          assert 'ensureConsent' in backup
          assert 'tsuki-data-v4' in backup
          assert 'tsuki-app-lock-v1' not in backup
          assert 'not end-to-end encrypted' in backup
          assert 'window.appearanceAssetGet' in backup and 'window.appearanceAssetPut' in backup
          assert 'tsukiCloudBackups' in backup
          assert 'firebase-firestore.js' in backup
          assert 'firebase-storage' not in backup.lower()

          assert 'request.auth != null && request.auth.uid == userId' in rules
          assert 'match /tsukiCloudBackups/{userId}/{document=**}' in rules
          assert 'TSUKI 7.5 — FIREBASE CLOUD BACKUP' in style

          install = sw.split('self.addEventListener("install"', 1)[1].split('UPDATE CONTROL', 1)[0]
          assert 'skipWaiting' not in install, 'install must not auto skipWaiting'
          print(f'Static QA passed: {len(ids)} IDs, {len(screens)} screens, {len(routes)} routes')
          PY

          mkdir -p /tmp/tsuki-pw && cd /tmp/tsuki-pw
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tsuki75-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          cat >/tmp/tsuki75-smoke.cjs <<'JS'
          const { chromium } = require('/tmp/tsuki-pw/node_modules/playwright');
          const assert = require('assert');

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:375,height:667},isMobile:true,hasTouch:true});
            const page = await context.newPage();
            await page.addInitScript(()=>{
              localStorage.setItem('tsuki-tutorial-complete-v1','1');
              localStorage.setItem('tsuki-whats-new-seen-v1','7.5.0');
            });
            const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
            page.on('console',m=>{ if(m.type()==='error') errors.push(`console: ${m.text()}`); });

            const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            function periods(ints,last=20){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-last);const starts=[new Date(d)];for(let i=ints.length-1;i>=0;i--){const x=new Date(starts[0]);x.setDate(x.getDate()-ints[i]);starts.unshift(x)}return starts.map((x,i)=>{const e=new Date(x);e.setDate(e.getDate()+4);return{id:`p${i}`,start:key(x),end:key(e),context:'',nextMoonNote:''}})}
            async function ready(){await page.waitForFunction(()=>window.TsukiAuth&&window.TsukiCloudBackup&&typeof forecastCycleLength==='function');await page.waitForFunction(()=>TsukiAuth.sdkReady===true,{timeout:20000})}
            async function seed(x){await page.evaluate(d=>{localStorage.setItem('tsuki-data-v4',JSON.stringify(d));localStorage.setItem('tsuki-tutorial-complete-v1','1');localStorage.setItem('tsuki-whats-new-seen-v1','7.5.0')},x);await page.reload({waitUntil:'networkidle'});await ready()}

            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await ready();
            assert.equal(await page.evaluate(()=>TsukiAuth.user),null);
            assert.equal(await page.locator('#firebaseCloudBackupPanel:not(.hidden)').count(),0);
            assert.equal(await page.evaluate(()=>typeof appearanceAssetGet==='function'&&typeof appearanceAssetPut==='function'),true);

            const schedule = await page.evaluate(()=>{
              const t=TsukiCloudBackup.test;
              const before=new Date(2026,7,14,7,59,0); const after=new Date(2026,7,14,8,1,0);
              return {
                before:t.afterBackupHour(before),
                after:t.afterBackupHour(after),
                nextBefore:t.nextBackupTime(before).getHours(),
                nextAfterDay:t.nextBackupTime(after).getDate(),
                afterDay:after.getDate(),
                chunks:t.chunkBytes(new Uint8Array(1100001)).length,
                assets:t.collectAssetKeys({settings:{wallpaperEnabled:true},pregnancy:{photos:[{assetKey:'pregnancy-photo:qa'}],documents:[{assetKey:'pregnancy-document:qa'}]}})
              };
            });
            assert.equal(schedule.before,false); assert.equal(schedule.after,true); assert.equal(schedule.nextBefore,8); assert.notEqual(schedule.nextAfterDay,schedule.afterDay); assert.equal(schedule.chunks,3);
            assert.deepEqual(new Set(schedule.assets),new Set(['wallpaper','pregnancy-photo:qa','pregnancy-document:qa']));

            await page.evaluate(()=>showScreen('me')); await page.waitForSelector('[data-screen="me"].active');
            await page.locator('#openFirebaseAccount').click();
            assert.equal(await page.locator('#firebaseAuthModal:not(.hidden)').count(),1);
            assert.equal(await page.locator('#firebaseSignedOutView:not(.hidden)').count(),1);
            await page.locator('#continueWithoutFirebase').click();

            const regular=periods([28,28,28,28]);
            await seed({schemaVersion:7.3,mode:'cycle',settings:{cycleLength:28,periodLength:5,predictionMode:'typical',cyclePattern:'regular'},periods:regular,logs:{}});
            assert.equal(await page.evaluate(()=>forecastCycleLength()),28);
            assert.ok(await page.evaluate(()=>calendarPredictionWindows(12).length>1));
            assert.equal(await page.evaluate(()=>data.periods.length),regular.length);

            const irregular=periods([34,52,41,67,36,53]);
            await seed({schemaVersion:7.3,mode:'cycle',settings:{cycleLength:28,periodLength:5,predictionMode:'typical',cyclePattern:'irregular',irregularCycleShape:'variable',cycleHistoryCompleteness:'complete',ignoredCycleIntervals:[],showIrregularPredictionWindow:true,showIrregularConfidence:true},periods:irregular,logs:{}});
            assert.equal(await page.evaluate(()=>irregularForecastWindow().useful),true);
            assert.equal(await page.evaluate(()=>calendarPredictionWindows(12).length),1);

            const edd=new Date(); edd.setDate(edd.getDate()+120);
            await seed({schemaVersion:7.3,mode:'pregnancy',settings:{cycleLength:28,periodLength:5,predictionMode:'typical',cyclePattern:'regular'},periods:regular,logs:{},pregnancy:{active:true,id:'qa',startedAt:new Date().toISOString(),datingMethod:'clinician',edd:key(edd),clinicianConfirmed:true}});
            assert.equal(await page.locator('[data-screen="pregnancy-today"].active').count(),1);
            assert.equal(await page.evaluate(()=>data.periods.length),regular.length);

            const beforeMock = await page.evaluate(()=>localStorage.getItem('tsuki-data-v4'));
            await page.evaluate(()=>{
              Object.defineProperty(window,'TsukiAuth',{configurable:true,value:{user:{uid:'qa-cloud-user',email:'qa@example.com'},app:null}});
              window.dispatchEvent(new CustomEvent('tsuki-auth-changed',{detail:{signedIn:true,uid:'qa-cloud-user'}}));
            });
            await page.waitForSelector('#firebaseCloudBackupPanel:not(.hidden)');
            assert.match(await page.locator('#cloudBackupScheduleNote').innerText(),/8:00 AM/i);
            assert.equal(await page.locator('#firebaseCloudBackupFact').innerText(),'Off');
            await page.waitForTimeout(100);
            assert.equal(await page.evaluate(()=>localStorage.getItem('tsuki-data-v4')),beforeMock,'sign-in state must not upload or mutate tracker data');

            const ids=await page.evaluate(()=>[...document.querySelectorAll('[id]')].map(x=>x.id));
            assert.deepEqual(ids.filter((id,i)=>ids.indexOf(id)!==i),[]);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
            const meta=await page.locator('meta[name="viewport"]').getAttribute('content');
            assert.ok(meta.includes('user-scalable=no')&&meta.includes('maximum-scale=1'));
            if(errors.length) throw new Error(errors.join(' | '));

            const offline = await browser.newContext({viewport:{width:375,height:667},isMobile:true,hasTouch:true});
            const op = await offline.newPage();
            await op.addInitScript(()=>{localStorage.setItem('tsuki-tutorial-complete-v1','1');localStorage.setItem('tsuki-whats-new-seen-v1','7.5.0')});
            await op.route('https://www.gstatic.com/firebasejs/**',r=>r.abort());
            await op.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await op.waitForFunction(()=>window.TsukiAuth&&TsukiAuth.serviceAvailable===false,{timeout:10000});
            assert.equal(await op.locator('[data-screen="today"].active').count(),1);
            await offline.close();

            console.log('Browser QA passed: cloud backup UI/schedule/chunking, no sign-in upload, regular/irregular/Pregnancy regressions, offline fallback, small iPhone');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/tsuki75-smoke.cjs

          mkdir -p /tmp/tsuki-rules && cd /tmp/tsuki-rules
          npm init -y >/dev/null 2>&1
          npm install --silent firebase@12.16.0 @firebase/rules-unit-testing firebase-tools
          cat >/tmp/tsuki-rules/rules-test.mjs <<'JS'
          import fs from 'node:fs';
          import { initializeTestEnvironment, assertSucceeds, assertFails } from '@firebase/rules-unit-testing';
          import { doc, setDoc, getDoc } from 'firebase/firestore';
          const rules = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/firestore.rules','utf8');
          const env = await initializeTestEnvironment({projectId:'demo-tsuki',firestore:{rules}});
          const alice = env.authenticatedContext('alice').firestore();
          const bob = env.authenticatedContext('bob').firestore();
          const anon = env.unauthenticatedContext().firestore();
          await assertSucceeds(setDoc(doc(alice,'tsukiCloudBackups/alice/snapshots/one'),{status:'complete'}));
          await assertSucceeds(getDoc(doc(alice,'tsukiCloudBackups/alice/snapshots/one')));
          await assertFails(getDoc(doc(bob,'tsukiCloudBackups/alice/snapshots/one')));
          await assertFails(setDoc(doc(bob,'tsukiCloudBackups/alice/snapshots/two'),{status:'complete'}));
          await assertFails(getDoc(doc(anon,'tsukiCloudBackups/alice/snapshots/one')));
          await env.cleanup();
          console.log('Firestore rules QA passed: owner-only backup paths');
          JS
          cd "$GITHUB_WORKSPACE"
          /tmp/tsuki-rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-tsuki "node /tmp/tsuki-rules/rules-test.mjs"

          rm -f .github/patches/tsuki75_cloud_backup_patch.py .github/workflows/tsuki75-cloud-backup-qa.yml
          git add app.js index.html style.css service-worker.js firebase-tsuki.js firebase-backup.js firestore.rules firebase.json
          git add -u .github
          git config user.name "Tsuki Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Tsuki 7.5 optional daily cloud backup"
          git push origin HEAD:agent/tsuki-7-5-cloud-backup
