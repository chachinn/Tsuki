name: Tsuki 7.5 Cloud Backup QA v2

on:
  push:
    branches: [agent/tsuki-7-5-cloud-backup]
    paths: [.github/workflows/tsuki75-cloud-backup-qa-v2.yml]

permissions:
  contents: write

jobs:
  qa-and-build-branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Tsuki 7.5, test and finalize feature branch
        env:
          BASE_SHA: 6dfa05de1dbe94a56b927eac7438646378d63423
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          python3 .github/patches/tsuki75_cloud_backup_patch.py

          node --check app.js
          node --check firebase-tsuki.js
          node --check firebase-backup.js
          node --check service-worker.js
          git diff --check

          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(); a=Path('app.js').read_text(); au=Path('firebase-tsuki.js').read_text(); b=Path('firebase-backup.js').read_text(); sw=Path('service-worker.js').read_text(); st=Path('style.css').read_text(); r=Path('firestore.rules').read_text()
          ids=re.findall(r'\bid="([^"]+)"',h); assert len(ids)==len(set(ids)), 'duplicate IDs'
          screens=set(re.findall(r'data-screen="([^"]+)"',h)); routes=set(re.findall(r'data-open-screen="([^"]+)"',h))|set(re.findall(r'data-screen-target="([^"]+)"',h)); assert not(routes-screens), routes-screens
          for x in ['firebaseCloudBackupPanel','firebaseCloudBackupFact','cloudBackupEnabled','cloudBackupNow','cloudBackupHistorySelect','cloudRestorePreviewButton','cloudRestorePreview','cloudRestorePreviewContent','cloudRestoreCancel','cloudRestoreConfirm','cloudBackupLastText','cloudBackupMessage','cloudDeleteBackups']:
              assert f'id="{x}"' in h, x
          assert 'const APP_VERSION = "7.5.0";' in a and 'const APP_CACHE_NAME = "tsuki-cache-v7-5";' in a
          assert 'const CACHE_NAME = "tsuki-cache-v7-5";' in sw and '"./firebase-backup.js"' in sw
          assert h.index('firebase-tsuki.js') < h.index('firebase-backup.js')
          assert 'get app() { return authState.app; }' in au and 'authState.app = firebaseApp;' in au
          for x in ['const BACKUP_HOUR = 8;','const RETAINED_SNAPSHOTS = 7;','const FIRESTORE_CHUNK_BYTES = 550000;','const MAX_ASSET_BYTES = 25 * 1024 * 1024;','ensureConsent','tsuki-data-v4','firebase-firestore.js','window.appearanceAssetGet','window.appearanceAssetPut','not end-to-end encrypted']:
              assert x in b, x
          assert 'tsuki-app-lock-v1' not in b and 'firebase-storage' not in b.lower()
          assert 'match /tsukiCloudBackups/{userId}/{document=**}' in r and 'request.auth != null && request.auth.uid == userId' in r
          assert 'TSUKI 7.5 — FIREBASE CLOUD BACKUP' in st
          install=sw.split('self.addEventListener("install"',1)[1].split('UPDATE CONTROL',1)[0]; assert 'skipWaiting' not in install
          print(f'Static QA passed: {len(ids)} IDs, {len(screens)} screens, {len(routes)} routes')
          PY

          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT

          cat >/tmp/smoke.cjs <<'JS'
          const {chromium}=require('/tmp/pw/node_modules/playwright'); const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:375,height:667},isMobile:true,hasTouch:true});
            const p=await ctx.newPage();
            await p.addInitScript(()=>{localStorage.setItem('tsuki-tutorial-complete-v1','1');localStorage.setItem('tsuki-whats-new-seen-v1','7.5.0')});
            const errs=[]; p.on('pageerror',e=>errs.push(`pageerror:${e.message}`)); p.on('console',m=>{if(m.type()==='error')errs.push(`console:${m.text()}`)});
            const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            function periods(ints,last=20){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-last);const starts=[new Date(d)];for(let i=ints.length-1;i>=0;i--){const x=new Date(starts[0]);x.setDate(x.getDate()-ints[i]);starts.unshift(x)}return starts.map((x,i)=>{const e=new Date(x);e.setDate(e.getDate()+4);return{id:`p${i}`,start:key(x),end:key(e),context:'',nextMoonNote:''}})}
            async function ready(){await p.waitForFunction(()=>window.TsukiAuth&&window.TsukiCloudBackup&&typeof forecastCycleLength==='function');await p.waitForFunction(()=>TsukiAuth.sdkReady===true,{timeout:20000})}
            async function seed(x){await p.evaluate(d=>{localStorage.setItem('tsuki-data-v4',JSON.stringify(d));localStorage.setItem('tsuki-tutorial-complete-v1','1');localStorage.setItem('tsuki-whats-new-seen-v1','7.5.0')},x);await p.reload({waitUntil:'networkidle'});await ready()}

            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await ready();
            assert.equal(await p.evaluate(()=>TsukiAuth.user),null); assert.equal(await p.locator('#firebaseCloudBackupPanel:not(.hidden)').count(),0);
            assert.equal(await p.evaluate(()=>typeof appearanceAssetGet==='function'&&typeof appearanceAssetPut==='function'),true);
            const sch=await p.evaluate(()=>{const t=TsukiCloudBackup.test,b=new Date(2026,7,14,7,59),a=new Date(2026,7,14,8,1);return{before:t.afterBackupHour(b),after:t.afterBackupHour(a),nb:t.nextBackupTime(b).getHours(),nd:t.nextBackupTime(a).getDate(),ad:a.getDate(),chunks:t.chunkBytes(new Uint8Array(1100001)).length,assets:t.collectAssetKeys({settings:{wallpaperEnabled:true},pregnancy:{photos:[{assetKey:'pregnancy-photo:qa'}],documents:[{assetKey:'pregnancy-document:qa'}]}})}});
            assert.equal(sch.before,false);assert.equal(sch.after,true);assert.equal(sch.nb,8);assert.notEqual(sch.nd,sch.ad);assert.equal(sch.chunks,3);assert.deepEqual(new Set(sch.assets),new Set(['wallpaper','pregnancy-photo:qa','pregnancy-document:qa']));

            await p.evaluate(()=>showScreen('me')); await p.waitForSelector('[data-screen="me"].active'); await p.locator('#openFirebaseAccount').click(); assert.equal(await p.locator('#firebaseSignedOutView:not(.hidden)').count(),1); await p.locator('#continueWithoutFirebase').click();
            const reg=periods([28,28,28,28]); await seed({schemaVersion:7.3,mode:'cycle',settings:{cycleLength:28,periodLength:5,predictionMode:'typical',cyclePattern:'regular'},periods:reg,logs:{}}); assert.equal(await p.evaluate(()=>forecastCycleLength()),28);assert.ok(await p.evaluate(()=>calendarPredictionWindows(12).length>1));assert.equal(await p.evaluate(()=>data.periods.length),reg.length);
            const irr=periods([34,52,41,67,36,53]); await seed({schemaVersion:7.3,mode:'cycle',settings:{cycleLength:28,periodLength:5,predictionMode:'typical',cyclePattern:'irregular',irregularCycleShape:'variable',cycleHistoryCompleteness:'complete',ignoredCycleIntervals:[],showIrregularPredictionWindow:true,showIrregularConfidence:true},periods:irr,logs:{}}); assert.equal(await p.evaluate(()=>irregularForecastWindow().useful),true);assert.equal(await p.evaluate(()=>calendarPredictionWindows(12).length),1);
            const edd=new Date();edd.setDate(edd.getDate()+120);await seed({schemaVersion:7.3,mode:'pregnancy',settings:{cycleLength:28,periodLength:5,predictionMode:'typical',cyclePattern:'regular'},periods:reg,logs:{},pregnancy:{active:true,id:'qa',startedAt:new Date().toISOString(),datingMethod:'clinician',edd:key(edd),clinicianConfirmed:true}});assert.equal(await p.locator('[data-screen="pregnancy-today"].active').count(),1);assert.equal(await p.evaluate(()=>data.periods.length),reg.length);

            const before=await p.evaluate(()=>localStorage.getItem('tsuki-data-v4'));
            await p.evaluate(()=>{Object.defineProperty(window,'TsukiAuth',{configurable:true,value:{user:{uid:'qa-cloud-user',email:'qa@example.com'},app:null}});window.dispatchEvent(new CustomEvent('tsuki-auth-changed',{detail:{signedIn:true,uid:'qa-cloud-user'}}))});
            await p.waitForFunction(()=>!document.getElementById('firebaseCloudBackupPanel').classList.contains('hidden'));
            assert.match(await p.locator('#cloudBackupScheduleNote').textContent(),/8:00 AM/i); assert.equal((await p.locator('#firebaseCloudBackupFact').textContent()).trim(),'Off'); await p.waitForTimeout(100); assert.equal(await p.evaluate(()=>localStorage.getItem('tsuki-data-v4')),before);
            const ids=await p.evaluate(()=>[...document.querySelectorAll('[id]')].map(x=>x.id));assert.deepEqual(ids.filter((id,i)=>ids.indexOf(id)!==i),[]);assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);const meta=await p.locator('meta[name="viewport"]').getAttribute('content');assert.ok(meta.includes('user-scalable=no')&&meta.includes('maximum-scale=1'));if(errs.length)throw new Error(errs.join(' | '));

            const off=await browser.newContext({viewport:{width:375,height:667},isMobile:true,hasTouch:true});const op=await off.newPage();await op.addInitScript(()=>{localStorage.setItem('tsuki-tutorial-complete-v1','1');localStorage.setItem('tsuki-whats-new-seen-v1','7.5.0')});await op.route('https://www.gstatic.com/firebasejs/**',r=>r.abort());await op.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await op.waitForFunction(()=>window.TsukiAuth&&TsukiAuth.serviceAvailable===false,{timeout:10000});assert.equal(await op.locator('[data-screen="today"].active').count(),1);await off.close();
            console.log('Browser QA passed: schedule/chunking/account isolation/regular/irregular/Pregnancy/offline/small iPhone');await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/smoke.cjs

          mkdir -p /tmp/rules && cd /tmp/rules
          npm init -y >/dev/null 2>&1
          npm install --silent firebase@12.16.0 @firebase/rules-unit-testing firebase-tools
          cat >/tmp/rules/test.mjs <<'JS'
          import fs from 'node:fs'; import {initializeTestEnvironment,assertSucceeds,assertFails} from '@firebase/rules-unit-testing'; import {doc,setDoc,getDoc} from 'firebase/firestore';
          const env=await initializeTestEnvironment({projectId:'demo-tsuki',firestore:{rules:fs.readFileSync(process.env.GITHUB_WORKSPACE+'/firestore.rules','utf8')}});const alice=env.authenticatedContext('alice').firestore(),bob=env.authenticatedContext('bob').firestore(),anon=env.unauthenticatedContext().firestore();await assertSucceeds(setDoc(doc(alice,'tsukiCloudBackups/alice/snapshots/one'),{status:'complete'}));await assertSucceeds(getDoc(doc(alice,'tsukiCloudBackups/alice/snapshots/one')));await assertFails(getDoc(doc(bob,'tsukiCloudBackups/alice/snapshots/one')));await assertFails(setDoc(doc(bob,'tsukiCloudBackups/alice/snapshots/two'),{status:'complete'}));await assertFails(getDoc(doc(anon,'tsukiCloudBackups/alice/snapshots/one')));await env.cleanup();console.log('Firestore rules QA passed: owner-only backup paths');
          JS
          cd "$GITHUB_WORKSPACE"
          /tmp/rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-tsuki "node /tmp/rules/test.mjs"

          rm -f .github/patches/tsuki75_cloud_backup_patch.py .github/workflows/tsuki75-cloud-backup-qa.yml .github/workflows/tsuki75-cloud-backup-qa-v2.yml
          git add app.js index.html style.css service-worker.js firebase-tsuki.js firebase-backup.js firestore.rules firebase.json
          git add -u .github
          git config user.name "Tsuki Update Bot"; git config user.email "actions@users.noreply.github.com"
          git commit -m "Tsuki 7.5 optional daily cloud backup"
          git push origin HEAD:agent/tsuki-7-5-cloud-backup
