name: Tsuki V1 Personal Health Intelligence 3 QA

on:
  push:
    branches:
      - agent/tsuki-v1-anticipatory-care-intelligence

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/tsuki-v1-anticipatory-care-intelligence
          fetch-depth: 0

      - name: Patch candidate
        run: python .github/tsuki-phi3/patch.py

      - name: Syntax and diff QA
        run: |
          set -euo pipefail
          node --check app.js
          node --check personal-health-intelligence.js
          node --check service-worker.js
          git diff --check

      - name: Privacy, safety and PWA invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text(); index=Path('index.html').read_text(); sw=Path('service-worker.js').read_text(); intel=Path('personal-health-intelligence.js').read_text()
          checks={
            'storage-v4':'const STORAGE_KEY = "tsuki-data-v4"' in app,
            'public-v1':'const APP_VERSION = "1.0.0"' in app,
            'app-cache':'tsuki-cache-v1-pre-personal-health-9' in app,
            'sw-cache':'tsuki-cache-v1-pre-personal-health-9' in sw,
            'index-loader':'./personal-health-intelligence.js' in index,
            'sw-two-lists':sw.count('"./personal-health-intelligence.js"') >= 2,
            'no-network':not re.search(r'firebase|firestore|storageBucket|XMLHttpRequest|WebSocket|fetch\(', intel, re.I),
            'no-period-assignment':not re.search(r'data\.periods\s*=', intel),
            'no-pregnancy-replacement':not re.search(r'data\.pregnancy\s*=', intel),
            'no-postpartum-replacement':not re.search(r'data\.postpartum\s*=', intel),
            'missing-unknown':'Missing days stay unknown' in intel,
            'user-concern':'Something feels wrong' in intel,
            'not-ovulation-proof':'not proof of ovulation' in intel,
          }
          install=sw.split('self.addEventListener("install"',1)[1].split('UPDATE CONTROL',1)[0]
          checks['no-auto-skipwaiting']='skipWaiting()' not in install
          for name, ok in checks.items(): print(f'{name}: {"PASS" if ok else "FAIL"}')
          failed=[n for n,o in checks.items() if not o]
          if failed: raise SystemExit('failed invariants: '+', '.join(failed))
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Mobile all-four-modes regression
        run: |
          python3 -m http.server 4173 >/tmp/tsuki-phi3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .github/tsuki-phi3/qa-phi3.cjs

      - name: Commit QA-passed product files
        run: |
          set -euo pipefail
          rm -rf node_modules package.json package-lock.json
          git add app.js index.html service-worker.js personal-health-intelligence.js
          git diff --cached --check
          git config user.name "Tsuki QA Bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Tsuki v1 Personal Health Intelligence 3.0"
            git push origin HEAD:agent/tsuki-v1-anticipatory-care-intelligence
          fi
